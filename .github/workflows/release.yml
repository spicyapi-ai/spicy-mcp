name: Release to npm

# Published through npm trusted publishing (OIDC): the identity comes from this workflow
# running in this repository, so no long-lived token is stored anywhere. npm also attaches a
# provenance attestation automatically, which a token-based publish does not get.
on:
  workflow_dispatch:
    inputs:
      registry_only:
        description: "Register an already-published npm version without publishing it again"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; Node 22 still ships npm 10.x, so the
      # bundled CLI would fall back to looking for a token that is no longer there and fail with
      # a bare 401 that says nothing about OIDC.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Skip when the version already exists, so re-running this workflow is safe rather than a
      # failure.
      - name: Publish if this version is new
        if: ${{ !inputs.registry_only }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --silent > /dev/null 2>&1; then
            echo "Skipping $NAME@$VERSION: already published."
          else
            echo "Publishing $NAME@$VERSION..."
            npm publish --access public
          fi

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.5
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for npm public availability
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 40); do
            if npm view "$NAME@$VERSION" version --silent > /dev/null 2>&1; then
              echo "$NAME@$VERSION is publicly available."
              exit 0
            fi
            echo "Waiting for npm to finish processing $NAME@$VERSION ($attempt/40)."
            sleep 15
          done
          echo "npm has not made the version public yet; do not republish the staged version."
          exit 1
      - name: Publish official MCP Registry metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
